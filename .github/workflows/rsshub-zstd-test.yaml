name: ZSTD to GZIP validation (temporary)

# 一次性验证 workflow：确认 ACR 接受由新版 skopeo 强制转 gzip 的 rsshub 层。
# 只写两个专用测试 tag，绝不覆盖 rsshub:latest / :chromium-bundled。
# 验证通过后删除本文件。
on:
  push:
    branches: [ exp/rsshub-zstd-to-gzip ]
  workflow_dispatch:

concurrency:
  group: rsshub-zstd-test
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3
  SRC_IMAGE: diygod/rsshub:latest

jobs:
  validate:
    name: Validate zstd to gzip conversion
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: 运行环境与磁盘
        run: |
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          lsb_release -ds
          docker --version
          jq --version
          echo "=== 磁盘 ==="
          df -h /
          df -i /

      - name: 拉取新版 skopeo 并确认转换参数
        run: |
          docker pull "$SKOPEO_IMAGE"
          echo "=== 版本 ==="
          docker run --rm "$SKOPEO_IMAGE" --version
          echo "=== 关键 flag 检查 ==="
          HELP=$(docker run --rm "$SKOPEO_IMAGE" copy --help 2>&1) || true
          echo "$HELP" | grep -A2 -- '--dest-force-compress-format' || true
          if ! echo "$HELP" | grep -q -- '--dest-force-compress-format'; then
            echo "::error::该 skopeo 版本缺少 --dest-force-compress-format，无法转换已压缩层"
            exit 1
          fi
          if ! echo "$HELP" | grep -q -- '--dest-compress-format'; then
            echo "::error::该 skopeo 版本缺少 --dest-compress-format"
            exit 1
          fi
          echo "✅ 转换参数齐备"

      - name: 读取源镜像层格式（确认是 zstd）
        run: |
          sk() { docker run --rm "$SKOPEO_IMAGE" "$@"; }
          SRC_CREDS=(--creds "$DOCKERHUB_USER:$DOCKERHUB_TOKEN")
          RAW=$(sk inspect "${SRC_CREDS[@]}" --raw "docker://$SRC_IMAGE")
          # 顶层可能是 OCI index / manifest list，需取 linux/amd64 子清单
          SUB=$(echo "$RAW" | jq -r '[.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest][0] // empty')
          if [ -n "$SUB" ]; then
            echo "顶层为多架构清单，linux/amd64 子清单: $SUB"
            REPO=$(echo "$SRC_IMAGE" | sed -E 's/:[^:/]+$//')
            RAW=$(sk inspect "${SRC_CREDS[@]}" --raw "docker://${REPO}@${SUB}")
          else
            echo "顶层即单架构清单"
          fi
          echo "=== 源层 mediaType 统计 ==="
          echo "$RAW" | jq -r '.layers[].mediaType' | sort | uniq -c
          Z=$(echo "$RAW" | jq -r '[.layers[].mediaType | select(contains("zstd"))] | length')
          echo "源 zstd 层数: $Z"
          if [ "$Z" -eq 0 ]; then
            echo "::warning::源镜像当前已不是 zstd，转换验证失去意义，但仍继续执行以确认链路"
          fi

      - name: 转换推送到测试 tag 并读回校验
        run: |
          sk() { docker run --rm "$SKOPEO_IMAGE" "$@"; }
          SRC_ARGS=(--src-creds "$DOCKERHUB_USER:$DOCKERHUB_TOKEN")
          DST_ARGS=(--dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD")
          INSPECT_ARGS=(--creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD")
          COMMON=(--retry-times 2 \
                  --override-os linux --override-arch amd64 \
                  --dest-force-compress-format --dest-compress-format gzip)
          TARGET_BASE="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/rsshub"
          OK_COUNT=0

          for variant in oci v2s2; do
            TAG="zstd2gzip-$variant"
            EXTRA=()
            if [ "$variant" = "v2s2" ]; then EXTRA=(--format v2s2); fi
            echo ""
            echo "=========================================================="
            echo "=== 变体 $variant -> $TARGET_BASE:$TAG ==="
            echo "=========================================================="
            if timeout 900 sk copy "${COMMON[@]}" "${EXTRA[@]}" \
                 "${SRC_ARGS[@]}" "${DST_ARGS[@]}" \
                 "docker://$SRC_IMAGE" "docker://$TARGET_BASE:$TAG"; then
              echo "✅ copy 完成"
            else
              echo "❌ copy 失败: $variant"
              continue
            fi

            echo "=== 读回目标 manifest ==="
            M=$(sk inspect "${INSPECT_ARGS[@]}" --raw "docker://$TARGET_BASE:$TAG" 2>/dev/null) || true
            if [ -z "$M" ]; then
              echo "❌ 无法读回目标 manifest: $variant"
              continue
            fi
            echo "$M" | jq -r '.layers[].mediaType' | sort | uniq -c
            Z=$(echo "$M" | jq -r '[.layers[].mediaType | select(contains("zstd"))] | length')
            G=$(echo "$M" | jq -r '[.layers[].mediaType | select(test("gzip"))] | length')
            echo "目标层数: $(echo "$M" | jq -r '.layers | length') | gzip=$G | zstd=$Z"
            if [ "$Z" -eq 0 ] && [ "$G" -gt 0 ]; then
              echo "✅ 变体 $variant 通过：目标全为 gzip 层，ACR 已接受"
              OK_COUNT=$((OK_COUNT + 1))
              echo "VARIANT_OK_$variant=$TAG" >> "$GITHUB_ENV"
            else
              echo "❌ 变体 $variant 未通过：仍有 zstd 层或无 gzip 层"
            fi
          done

          echo ""
          echo "=== 汇总：通过变体数 $OK_COUNT / 2 ==="
          echo "OK_COUNT=$OK_COUNT" >> "$GITHUB_ENV"
          if [ "$OK_COUNT" -eq 0 ]; then
            echo "::error::两种 manifest 格式均未通过，需要换方案"
            exit 1
          fi

      - name: 匿名读回公开仓库复核
        run: |
          # 公开仓库可匿名读，验证不依赖写凭据也能拿到转换后的层
          TARGET_BASE="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/rsshub"
          # 从 /v2/ 的 WWW-Authenticate 动态解析 realm / service，避免硬编码 ACR 鉴权地址
          WWW=$(curl -sI --max-time 20 "https://${ALIYUN_REGISTRY}/v2/" | grep -i '^www-authenticate:' | head -1) || true
          REALM=$(echo "$WWW" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          SERVICE=$(echo "$WWW" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          if [ -z "$REALM" ]; then
            echo "⚠️ 无法解析匿名鉴权地址，跳过（前一步已用写凭据读回验证）"
            exit 0
          fi
          TOKEN=$(curl -fsSL --max-time 30 --get \
            --data-urlencode "service=$SERVICE" \
            --data-urlencode "scope=repository:${ALIYUN_NAME_SPACE}/rsshub:pull" \
            "$REALM" | jq -r '.token // .access_token // empty' 2>/dev/null) || true
          if [ -z "$TOKEN" ]; then
            echo "⚠️ 匿名 token 获取失败，跳过（不影响主判定，前一步已用写凭据读回验证）"
            exit 0
          fi
          for variant in oci v2s2; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://${ALIYUN_REGISTRY}/v2/${ALIYUN_NAME_SPACE}/rsshub/manifests/zstd2gzip-$variant")
            echo "匿名读回 zstd2gzip-$variant: HTTP $CODE"
          done

      - name: 磁盘收尾
        if: always()
        run: |
          df -h /
          docker system df || true
