name: Docker Image Sync to Aliyun

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 10:00 / 22:00 (即北京时间 18:00 / 06:00) 运行
    - cron: '0 10,22 * * *'
  push:
    branches: [ main ]
    paths:
      - 'images.txt'

concurrency:
  group: aliyun-image-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选：Docker Hub 凭据，避免匿名拉取被限流
  DOCKERHUB_USER: "${{ secrets.DOCKERHUB_USER }}"
  DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"

jobs:
  build:
    name: Sync Images
    # ubuntu-latest 正在灰度迁移到 Ubuntu 26.04 (2026-10-19 ~ 11-19)，
    # 期间同一份 workflow 可能落到 24.04 或 26.04。刚修完磁盘问题，先固定 24.04 求稳；
    # 想提前验证 26.04，把下面一行改成 runs-on: ubuntu-26.04 即可。
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    
    steps:
      # 1. 验证运行器环境
      - name: 验证运行器环境
        run: |
          echo "=== 运行器环境报告 ==="
          echo "运行器环境：${{ runner.environment }}"
          echo "运行器名称：${{ runner.name }}"
          echo "运行器标签：${{ toJson(runner.labels) }}"
          echo "=== 运行器镜像版本（排查系统漂移） ==="
          echo "ImageOS=${ImageOS:-未设置} ImageVersion=${ImageVersion:-未设置}"
          lsb_release -ds 2>/dev/null || true
          echo "Docker: $(docker --version 2>/dev/null || echo '未安装')"
          
          # 决定性检查：如果是自托管环境，立即失败
          if [ "${{ runner.environment }}" == "self-hosted" ]; then
            echo "❌ 严重错误：检测到自托管运行器 (self-hosted)。"
            echo "这意味着您指定的运行器标签仍被某个自托管运行器匹配。"
            echo "请立即检查并删除您账户下同名的自托管运行器。"
            exit 1
          fi
          
          echo "✅ 当前运行于 GitHub 托管的运行器 (${{ runner.os }})。"
          echo "当前工作目录：$(pwd)"
          echo "可用磁盘空间："
          df -h /
          df -i /
      
      # 2. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v7
      
      # 3. 安装必需工具
      - name: Install required tools
        run: |
          echo "=== 安装必需工具 ==="
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo jq
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "✅ skopeo 版本: $(skopeo --version)"
          echo "✅ jq 版本: $(jq --version)"
      
      # 4. 释放根盘空间（只删预装工具链，不重分区）
      #    原 maximize-build-space 会把 / 压到 root-reserve-mb=2048，
      #    而 runner 的 _diag、$RUNNER_TEMP、$GITHUB_WORKSPACE 都在 / 上，
      #    等于把 runner 自己憋死，报错正是写 _diag 日志失败。
      - name: Free disk space
        run: |
          echo "=== 清理前 ==="
          df -h /
          df -i /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== 清理后 ==="
          df -h /
      
      # 5. 进入同步前记录磁盘水位
      - name: Disk preflight
        run: |
          echo "=== 磁盘预检 ==="
          df -h /
          df -i /
          docker system df || true
      
      # 6. 并行检查镜像状态，然后串行同步需要更新的镜像
      - name: Parallel Check and Sequential Sync
        id: sync_step
        run: |
          echo "=== 开始同步镜像到阿里云 ==="
          
          # skopeo 仓库到仓库直传，用 --dest-creds 认证，无需 docker login / Docker daemon
          TMPBASE="$RUNNER_TEMP/skopeo-tmp"
          if [ -d /mnt ] && [ "$(stat -c %d /mnt 2>/dev/null)" != "$(stat -c %d /)" ]; then
              TMPBASE=/mnt/skopeo-tmp
          fi
          mkdir -p "$TMPBASE"
          export TMPDIR="$TMPBASE"
          echo "skopeo 临时目录: $TMPBASE"
          echo "=== 临时目录所在磁盘（Ubuntu 26.04 的 /tmp 是内存盘，必须确认） ==="
          df -h "$TMPBASE"
          df -i "$TMPBASE" 2>/dev/null || true
          echo "=== 根盘 ==="
          df -h /
          df -i /

          # Docker Hub PAT 只能发给 Docker Hub：images.txt 里还有 ghcr.io 等第三方
          # registry，无差别加 --src-creds 会把凭据发给对方并可能导致认证失败。
          # 用法: mapfile -t HUB_ARGS < <(hub_creds --creds "$image")       # inspect
          #       mapfile -t HUB_ARGS < <(hub_creds --src-creds "$image")   # copy
          hub_creds() {
              local flag="$1" ref="$2" host
              [[ -z "$DOCKERHUB_USER" || -z "$DOCKERHUB_TOKEN" ]] && return 0
              if [[ "$ref" != */* ]]; then
                  printf '%s\n%s\n' "$flag" "$DOCKERHUB_USER:$DOCKERHUB_TOKEN"
                  return 0
              fi
              host="${ref%%/*}"
              case "$host" in
                  *.*|*:*|localhost)
                      case "$host" in
                          docker.io|index.docker.io|registry-1.docker.io)
                              printf '%s\n%s\n' "$flag" "$DOCKERHUB_USER:$DOCKERHUB_TOKEN" ;;
                      esac
                      ;;
                  *)
                      # 无域名前缀 => Docker Hub (library/nginx、user/repo)
                      printf '%s\n%s\n' "$flag" "$DOCKERHUB_USER:$DOCKERHUB_TOKEN" ;;
              esac
          }
          
          # 阿里云 ACR 个人版不接受 zstd 压缩层（上传时返回 blob type invalid）。
          # 老 workflow 走 docker pull/tag/push 时由 Docker daemon 顺带重压成 gzip；
          # 改成 skopeo 仓库直传后 zstd 层被原样上传，rsshub 两个镜像因此失败。
          # 这里按层 mediaType 自动识别，只对 zstd 源启用新版 skopeo 强制转 gzip，
          # 不硬编码镜像名：上游改回 gzip 或将来新增 zstd 镜像都能自适应。
          SKOPEO_NEW_IMAGE="quay.io/skopeo/stable:v1.22.3"
          SKOPEO_NEW_READY=0

          ensure_new_skopeo() {
              [ "$SKOPEO_NEW_READY" -eq 1 ] && return 0
              if docker pull -q "$SKOPEO_NEW_IMAGE" > /dev/null 2>&1; then
                  SKOPEO_NEW_READY=1
                  echo "  ✅ 新版 skopeo 已就绪: $SKOPEO_NEW_IMAGE"
                  return 0
              fi
              echo "  ❌ 无法拉取 $SKOPEO_NEW_IMAGE"
              return 1
          }

          # 判定 copy 将要选取的架构的源镜像是否含 zstd 层
          # 用法: src_layers_need_convert "$image" "$ARCH" "${HUB_INSPECT_ARGS[@]}"
          src_layers_need_convert() {
              local image="$1" arch="$2"
              shift 2
              local raw sub repo
              raw=$(skopeo inspect "$@" --raw "docker://$image" 2>/dev/null) || return 1
              sub=$(echo "$raw" | jq -r --arg a "$arch" \
                    '[.manifests[]? | select(.platform.os=="linux" and .platform.architecture==$a) | .digest][0] // empty')
              if [ -n "$sub" ]; then
                  # 去掉末尾 tag，同时保留 registry 可能带的端口
                  repo=$(echo "$image" | sed -E 's/:[^:/]+$//')
                  raw=$(skopeo inspect "$@" --raw "docker://${repo}@${sub}" 2>/dev/null) || return 1
              fi
              echo "$raw" | jq -e '[.layers[]?.mediaType | select(. and contains("zstd"))] | length > 0' > /dev/null 2>&1
          }

          SYNC_SUMMARY=""
          SUCCESS_COUNT=0
          FAILURE_COUNT=0
          SKIP_COUNT=0
          
          # 第一步：预处理，找出重名镜像
          echo "=== 预处理：检测重名镜像 ==="
          declare -A duplicate_images
          declare -A temp_map
          
          while IFS= read -r line || [ -n "$line" ]; do
              # 忽略空行与注释
              [[ -z "$line" ]] && continue
              if echo "$line" | grep -q '^\s*#'; then
                  continue
              fi
              
              # 获取镜像的完整名称
              raw_image=$(echo "$line" | awk '{print $NF}')
              # 移除 @sha256: 等摘要信息
              image="${raw_image%%@*}"
              # 获取镜像名:版本号 例如 nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              # 获取命名空间
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              
              # 如果命名空间为空，使用特定标记
              if [[ -z "$name_space" ]]; then
                  name_space="library"
              fi
              
              # 获取镜像名（不含标签）例如 nginx
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
              
              # 如果镜像存在于数组中，则检查是否有重名冲突
              if [[ -n "${temp_map[$image_name]}" ]]; then
                   # 如果 temp_map 已经存在镜像名，判断是不是同一命名空间
                   if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                      duplicate_images[$image_name]="true"
                   fi
              else
                  # 存镜像的命名空间
                  temp_map[$image_name]="$name_space"
              fi
          done < images.txt
          
          echo "✅ 预处理完成，发现 ${#duplicate_images[@]} 个重名镜像"
          
          # 第二步：并行检查镜像状态
          echo "=== 并行检查镜像状态 ==="
          
          # 创建临时文件存储镜像信息
          TEMP_FILE=$(mktemp)
          NEED_SYNC_FILE=$(mktemp)
          SKIPPED_FILE=$(mktemp)
          
          # 计算总行数
          TOTAL_LINES=$(wc -l < images.txt)
          LINE_NUMBER=0
          
          # 逐行读取并处理镜像信息
          while IFS= read -r line || [ -n "$line" ]; do
              LINE_NUMBER=$((LINE_NUMBER + 1))
              
              # 忽略空行与注释
              [[ -z "$line" ]] && continue
              if echo "$line" | grep -q '^\s*#'; then
                  echo "📝 第 $LINE_NUMBER 行: 跳过注释行"
                  continue
              fi
              
              # 获取原始镜像信息
              raw_image=$(echo "$line" | awk '{print $NF}')
              # 移除 @sha256: 等摘要信息
              image="${raw_image%%@*}"
              
              # 获取镜像名:版本号 例如 nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              # 获取命名空间
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              
              # 如果命名空间为空，使用特定标记
              if [[ -z "$name_space" ]]; then
                  name_space="library"
              fi
              
              # 获取镜像名（不含标签）例如 nginx
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
              
              # 提取平台架构信息
              platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
              
              # 如果存在架构信息，将架构信息拼到镜像名称前面
              if [ -z "$platform" ]; then
                  platform_prefix=""
              else
                  platform_prefix="${platform//\//_}_"
              fi
              
              name_space_prefix=""
              # 如果镜像名重名且命名空间不同
              if [[ -n "${duplicate_images[$image_name]}" ]]; then
                 # 如果命名空间非空，将命名空间加到前缀
                 name_space_prefix="${name_space}_"
              fi
              
              # 构造目标镜像名称
              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
              
              # 将镜像信息写入临时文件
              echo "$LINE_NUMBER|$image|$new_image|$image_name_tag|$name_space|${platform:-默认}|${duplicate_images[$image_name]:+是 (使用前缀)}" >> "$TEMP_FILE"
          done < images.txt
          
          # 定义并行检查函数
          check_image_status() {
              local line_data="$1"
              local line_number=$(echo "$line_data" | cut -d'|' -f1)
              local image=$(echo "$line_data" | cut -d'|' -f2)
              local new_image=$(echo "$line_data" | cut -d'|' -f3)
              local image_name_tag=$(echo "$line_data" | cut -d'|' -f4)
              local name_space=$(echo "$line_data" | cut -d'|' -f5)
              local platform=$(echo "$line_data" | cut -d'|' -f6)
              local duplicate_info=$(echo "$line_data" | cut -d'|' -f7)
              
              echo "--- 检查第 $line_number 行: $image -> $new_image ($platform) ---"
              
              # 检查目标镜像是否存在
              if skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" > /dev/null 2>&1; then
                  # 目标镜像存在，比较镜像创建时间
                  echo "目标镜像存在，比较镜像创建时间..."
                  
                  # 获取源镜像的创建时间 - 修复时间比较逻辑
                  mapfile -t HUB_ARGS < <(hub_creds --creds "$image")
                  SRC_INFO=$(skopeo inspect "${HUB_ARGS[@]}" "docker://$image" 2>/dev/null)
                  if [ $? -eq 0 ]; then
                    SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.Created // empty' 2>/dev/null)
                    # 尝试多种可能的时间字段
                    if [ -z "$SRC_CREATED_RAW" ] || [ "$SRC_CREATED_RAW" = "null" ]; then
                      SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.created // empty' 2>/dev/null)
                    fi
                    if [ -z "$SRC_CREATED_RAW" ] || [ "$SRC_CREATED_RAW" = "null" ]; then
                      SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.Labels."org.opencontainers.image.created" // empty' 2>/dev/null)
                    fi
                  else
                    SRC_CREATED_RAW=""
                  fi
                  
                  # 获取目标镜像的创建时间
                  TARGET_INFO=$(skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null)
                  if [ $? -eq 0 ]; then
                    TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.Created // empty' 2>/dev/null)
                    # 尝试多种可能的时间字段
                    if [ -z "$TARGET_CREATED_RAW" ] || [ "$TARGET_CREATED_RAW" = "null" ]; then
                      TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.created // empty' 2>/dev/null)
                    fi
                    if [ -z "$TARGET_CREATED_RAW" ] || [ "$TARGET_CREATED_RAW" = "null" ]; then
                      TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.Labels."org.opencontainers.image.created" // empty' 2>/dev/null)
                    fi
                  else
                    TARGET_CREATED_RAW=""
                  fi
                  
                  if [ -n "$SRC_CREATED_RAW" ] && [ -n "$TARGET_CREATED_RAW" ] && [ "$SRC_CREATED_RAW" != "null" ] && [ "$TARGET_CREATED_RAW" != "null" ]; then
                      # 解析源镜像时间
                      SRC_TIMESTAMP=$(date -u -d "$SRC_CREATED_RAW" +%s 2>/dev/null || echo "0")
                      
                      # 解析目标镜像时间
                      TARGET_TIMESTAMP=$(date -u -d "$TARGET_CREATED_RAW" +%s 2>/dev/null || echo "0")
                      
                      # 如果时间戳解析失败，回退到比较镜像摘要
                      if [ $SRC_TIMESTAMP -ne 0 ] && [ $TARGET_TIMESTAMP -ne 0 ]; then
                          # 比较时间戳：如果Docker Hub的镜像创建时间晚于阿里云的镜像创建时间，则同步
                          if [ "$SRC_TIMESTAMP" -gt "$TARGET_TIMESTAMP" ]; then
                              echo "🔄 源镜像创建时间更新，需要同步: $image_name_tag"
                              echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|$SRC_TIMESTAMP|$TARGET_TIMESTAMP" >&3
                          elif [ "$SRC_TIMESTAMP" -eq "$TARGET_TIMESTAMP" ]; then
                              echo "✅ 源镜像与目标镜像创建时间相同，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|same_time" >&3
                          else
                              echo "✅ 源镜像创建时间早于目标镜像，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|older_source" >&3
                          fi
                      else
                          # 时间戳解析失败，比较镜像摘要
                          # 获取源镜像摘要
                          SRC_DIGEST=$(echo "$SRC_INFO" | jq -r '.Digest // empty' 2>/dev/null)
                          if [ -z "$SRC_DIGEST" ] || [ "$SRC_DIGEST" = "null" ]; then
                            SRC_DIGEST=$(echo "$SRC_INFO" | jq -r '.digest // empty' 2>/dev/null)
                          fi
                          
                          # 获取目标镜像摘要
                          TARGET_DIGEST=$(echo "$TARGET_INFO" | jq -r '.Digest // empty' 2>/dev/null)
                          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "null" ]; then
                            TARGET_DIGEST=$(echo "$TARGET_INFO" | jq -r '.digest // empty' 2>/dev/null)
                          fi
                          
                          if [ -n "$SRC_DIGEST" ] && [ -n "$TARGET_DIGEST" ] && [ "$SRC_DIGEST" = "$TARGET_DIGEST" ]; then
                              echo "✅ 镜像摘要相同，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|same_digest" >&3
                          else
                              echo "🔄 镜像摘要不同或无法获取，需要同步: $image_name_tag"
                              echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
                          fi
                      fi
                  else
                      # 无法获取创建时间，检查镜像大小作为辅助判断
                      mapfile -t HUB_ARGS < <(hub_creds --creds "$image")
                      SRC_SIZE=$(skopeo inspect "${HUB_ARGS[@]}" "docker://$image" --format '{{.Size}}' 2>/dev/null || echo "0")
                      TARGET_SIZE=$(skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" --format '{{.Size}}' 2>/dev/null || echo "0")
                      
                      if [ "$SRC_SIZE" != "0" ] && [ "$TARGET_SIZE" != "0" ] && [ "$SRC_SIZE" = "$TARGET_SIZE" ]; then
                          echo "✅ 镜像大小相同，可能已同步，跳过: $image_name_tag"
                          echo "SKIPPED|$line_number|$image_name_tag|same_size" >&3
                      else
                          echo "🔄 无法确定镜像状态，需要同步: $image_name_tag"
                          echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
                      fi
                  fi
              else
                  echo "🔄 目标镜像不存在，需要同步: $image_name_tag"
                  echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
              fi
          }
          
          export -f check_image_status
          export -f hub_creds
          export ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD DOCKERHUB_USER DOCKERHUB_TOKEN
          
          # 设置文件描述符用于收集结果
          exec 3<> >(while read result; do
            if [[ $result == NEED_SYNC* ]]; then
              echo "$result" >> "$NEED_SYNC_FILE"
            elif [[ $result == SKIPPED* ]]; then
              echo "$result" >> "$SKIPPED_FILE"
            fi
          done)
          
          # 使用并行处理所有镜像状态检查
          cat "$TEMP_FILE" | xargs -P 4 -I {} bash -c 'check_image_status "$@"' _ {}
          
          # 关闭文件描述符
          exec 3<&-
          wait
          
          # 第三步：串行同步需要更新的镜像
          echo "=== 开始串行同步需要更新的镜像 ==="
          
          # 统计跳过的镜像
          while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                  skip_reason=$(echo "$line" | cut -d'|' -f4)
                  case $skip_reason in
                      "same_time") reason_text="创建时间相同" ;;
                      "older_source") reason_text="目标镜像已更新" ;;
                      "same_digest") reason_text="摘要相同" ;;
                      "same_size") reason_text="大小相同" ;;
                  esac
                  image_name_tag=$(echo "$line" | cut -d'|' -f3)
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n⏭️ $image_name_tag ($reason_text)"
                  SKIP_COUNT=$((SKIP_COUNT + 1))
              fi
          done < "$SKIPPED_FILE"
          
          # 串行同步需要更新的镜像
          while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                  line_number=$(echo "$line" | cut -d'|' -f2)
                  image=$(echo "$line" | cut -d'|' -f3)
                  new_image=$(echo "$line" | cut -d'|' -f4)
                  image_name_tag=$(echo "$line" | cut -d'|' -f5)
                  
                  echo "--- 同步第 $line_number 行: $image_name_tag ---"
                  echo "原始镜像: $image"
                  echo "目标镜像: $new_image"
                  
                  ARCH="amd64"
                  SRC_PLATFORM=$(echo "$line" | cut -d'|' -f7)
                  if [[ "$SRC_PLATFORM" == */* ]]; then
                      ARCH="${SRC_PLATFORM##*/}"
                  fi

                  rm -rf "$TMPBASE"/*
                  USED=$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
                  echo "根盘使用率: ${USED}% | skopeo 临时目录: $TMPBASE"
                  if [ "$USED" -ge 90 ]; then
                      echo "::error::根盘使用率 ${USED}%，提前中止，避免 runner 写日志失败导致整个 job 崩溃"
                      exit 1
                  fi

                  echo "步骤 1/1: skopeo 直传 (不落 Docker 存储)..."
                  mapfile -t HUB_ARGS < <(hub_creds --src-creds "$image")
                  mapfile -t HUB_INSPECT_ARGS < <(hub_creds --creds "$image")

                  # 仅对 zstd 源启用强制转 gzip；其余镜像保持原路径不变
                  COPY_CMD=(skopeo --tmpdir "$TMPBASE" copy --retry-times 3
                            --override-os linux --override-arch "$ARCH")
                  if src_layers_need_convert "$image" "$ARCH" "${HUB_INSPECT_ARGS[@]}"; then
                      echo "  🔧 源含 zstd 层，ACR 不接受，启用新版 skopeo 强制转 gzip"
                      if ensure_new_skopeo; then
                          # 1.13.3 的 --dest-compress-format 不会重压已压缩层，
                          # 必须用 1.21+ 的 --dest-force-compress-format。
                          # 目标转成 Docker schema2，与 ACR 上现有正式 tag 格式一致，
                          # 客户端兼容性最保守；实测保持源 OCI manifest 也可行。
                          COPY_CMD=(docker run --rm "$SKOPEO_NEW_IMAGE" copy
                                    --retry-times 3
                                    --override-os linux --override-arch "$ARCH"
                                    --dest-force-compress-format
                                    --dest-compress-format gzip
                                    --format v2s2)
                      else
                          echo "  ⚠️ 新版 skopeo 不可用，退回原路径（该镜像预计仍会失败）"
                      fi
                  fi

                  if timeout 900 "${COPY_CMD[@]}" \
                       "${HUB_ARGS[@]}" \
                       --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
                       "docker://$image" "docker://$new_image"; then
                      echo "  ✅ 同步成功"
                      SYNC_SUMMARY="${SYNC_SUMMARY}\n✨ $image_name_tag"
                      SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                      echo "✅ 同步完成: $image_name_tag"
                  else
                      echo "  ❌ 同步失败"
                      SYNC_SUMMARY="${SYNC_SUMMARY}\n🚨 $image_name_tag (同步失败)"
                      FAILURE_COUNT=$((FAILURE_COUNT + 1))
                  fi

                  # 无论成功失败都清掉本轮临时 blob
                  rm -rf "$TMPBASE"/*
                  echo ""
              fi
          done < "$NEED_SYNC_FILE"
          
          echo "=== 同步完成 ==="
          echo "成功: $SUCCESS_COUNT, 跳过: $SKIP_COUNT, 失败: $FAILURE_COUNT"
          
          # 清理临时文件
          rm -f "$TEMP_FILE" "$NEED_SYNC_FILE" "$SKIPPED_FILE"
          rm -rf "$TMPBASE"
          
          # 写入环境变量
          echo "SUCCESS_COUNT=$SUCCESS_COUNT" >> $GITHUB_ENV
          echo "FAILURE_COUNT=$FAILURE_COUNT" >> $GITHUB_ENV
          echo "SKIP_COUNT=$SKIP_COUNT" >> $GITHUB_ENV
          {
            echo 'SYNC_RESULT<<EOF'
            if [ -n "$SYNC_SUMMARY" ]; then
                echo -e "$SYNC_SUMMARY"
            else
                echo "本次没有需要同步的新镜像"
            fi
            echo 'EOF'
          } >> $GITHUB_ENV      
      # 7. 收尾清理与磁盘报告
      - name: Clean up and disk report
        if: always()
        run: |
          echo "=== 收尾清理 ==="
          rm -rf "$RUNNER_TEMP/skopeo-tmp" /mnt/skopeo-tmp 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          echo "剩余磁盘空间:"
          df -h /
          df -i /
      
      # 8. 发送 Server酱 微信通知（每次运行都推，包括「无更新」）
      - name: 发送 Server酱 通知
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
              echo "⚠️ 未配置 SERVERCHAN_SENDKEY，跳过微信通知"
              exit 0
          fi

          S_COUNT="${SUCCESS_COUNT:-0}"
          F_COUNT="${FAILURE_COUNT:-0}"
          K_COUNT="${SKIP_COUNT:-0}"

          # 1. 判定标题与主状态
          if [ "$JOB_STATUS" != "success" ]; then
              TITLE="🚨 同步任务异常终止"
              CONTENT="工作流状态：$JOB_STATUS，请查看运行日志。"
          elif [ "$F_COUNT" -gt 0 ]; then
              TITLE="❌ 阿里云镜像同步失败"
              CONTENT="⚠️ 有 $F_COUNT 个镜像同步异常，请及时检查。"
          elif [ "$S_COUNT" -gt 0 ]; then
              TITLE="✅ 阿里云镜像同步成功"
              CONTENT="本次新增同步镜像如下："
          elif [ "$K_COUNT" -gt 0 ]; then
              TITLE="⏭️ 同步完成，镜像已是最新"
              CONTENT="基于创建时间比较，所有镜像已是最新版本，无需同步。"
          else
              TITLE="☕ 同步任务完成，无镜像需要处理"
              CONTENT="检测到 images.txt 中无有效镜像需要处理。"
          fi

          # 2. 组装 Markdown 正文（Server酱 的 desp 支持 Markdown）
          #    只推 ✨ 新增 / 🚨 失败，⏭️ 跳过项和「本次没有需要同步的新镜像」
          #    等占位文案一律过滤；SYNC_RESULT 仍保留完整明细供日志使用
          SYNC_LIST=""
          if [ -n "${SYNC_RESULT:-}" ]; then
              # LC_ALL=C 按字节匹配，避免 runner 多字节 locale 差异影响 🚨(4 字节) 的命中
              SYNC_LIST=$(printf '%s\n' "$SYNC_RESULT" \
                  | LC_ALL=C grep -E '^(✨|🚨)' \
                  | sed 's/^/- /' || true)
          fi
          # 打印过滤后的明细，便于在 Action 日志中核对推送内容（不打印 SendKey / URL）
          echo "📋 通知明细（仅新增 / 失败）:"
          printf '%s\n' "${SYNC_LIST:-（本次无新增或失败项）}"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          SC_DESP=$(cat <<EOF
          ## $TITLE

          $CONTENT

          $SYNC_LIST

          ---

          📊 **统计**：成功 $S_COUNT ｜ 跳过 $K_COUNT ｜ 失败 $F_COUNT
          📅 **时间**：$(date '+%Y-%m-%d %H:%M:%S')
          🔗 [查看 GitHub Action 日志]($RUN_URL)
          EOF
          )

          # 3. 按 SendKey 前缀自动选择 Server酱Turbo / Server酱³ 接口
          case "$SERVERCHAN_SENDKEY" in
              sctp*)
                  SC_UID=$(echo "$SERVERCHAN_SENDKEY" | sed -E 's/^sctp([0-9]+)t.*/\1/')
                  if ! [[ "$SC_UID" =~ ^[0-9]+$ ]]; then
                      echo "::warning::sctp SendKey 格式异常，无法解析 uid，跳过通知"
                      exit 0
                  fi
                  SC_URL="https://${SC_UID}.push.ft07.com/send/${SERVERCHAN_SENDKEY}.send"
                  ;;
              *)
                  SC_URL="https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send"
                  ;;
          esac

          # title 不能含换行；标题是固定短文案，不做字节截断以免切坏中文
          SC_TITLE=$(printf '%s' "$TITLE" | tr '\n' ' ')

          # 4. 发送：成功以返回 JSON 的 code==0 为准，最多重试 3 次
          #    不要打印 SC_URL 或响应原文（SendKey 在 URL 中）
          for i in 1 2 3; do
              RESP=$(curl -s --max-time 15 -X POST \
                  --data-urlencode "title=$SC_TITLE" \
                  --data-urlencode "desp=$SC_DESP" \
                  "$SC_URL" 2>/dev/null) || RESP=""
              if echo "$RESP" | jq -e '.code == 0' >/dev/null 2>&1; then
                  echo "✅ Server酱 通知发送成功 (第 $i 次)"
                  exit 0
              fi
              echo "⚠️ Server酱 通知发送失败 (第 $i 次)，2 秒后重试"
              sleep 2
          done
          echo "::warning::Server酱 通知发送失败（已重试 3 次），不影响同步结果"
