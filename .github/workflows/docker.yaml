name: Docker Image Sync to Aliyun

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 时间 00:00 (即北京时间 08:00) 运行
    - cron: '0 10,22 * * *'
  push:
    branches: [ main ]
    paths:
      - 'images.txt'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  WEBHOOK_URL: "${{ secrets.WEBHOOK_URL }}" # 在 Secrets 中配置飞书或企微地址

jobs:
  build:
    name: Sync Images
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    
    steps:
      # 1. 验证运行器环境
      - name: 验证运行器环境
        run: |
          echo "=== 运行器环境报告 ==="
          echo "运行器环境：${{ runner.environment }}"
          echo "运行器名称：${{ runner.name }}"
          echo "运行器标签：${{ toJson(runner.labels) }}"
          
          # 决定性检查：如果是自托管环境，立即失败
          if [ "${{ runner.environment }}" == "self-hosted" ]; then
            echo "❌ 严重错误：检测到自托管运行器 (self-hosted)。"
            echo "这意味着您的 'ubuntu-latest' 标签仍被某个自托管运行器匹配。"
            echo "请立即检查并删除您账户下标记为 'ubuntu-latest' 的自托管运行器。"
            exit 1
          fi
          
          echo "✅ 当前运行于 GitHub 托管的运行器 (${{ runner.os }})。"
          echo "当前工作目录：$(pwd)"
          echo "可用磁盘空间："
          df -h
      
      # 2. 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # 3. 安装必需工具
      - name: Install required tools
        run: |
          echo "=== 安装必需工具 ==="
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          echo "✅ skopeo 版本: $(skopeo --version)"
          echo "✅ jq 版本: $(jq --version)"
      
      # 4. 最大化构建空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'
      
      # 5. 重启 Docker
      - name: Restart docker
        run: |
          echo "=== 重启 Docker 服务 ==="
          sudo service docker restart
          sleep 5
          docker info
      
      # 6. 并行检查镜像状态，然后串行同步需要更新的镜像
      - name: Parallel Check and Sequential Sync
        id: sync_step
        run: |
          echo "=== 开始同步镜像到阿里云 ==="
          
          # 登录阿里云容器镜像服务
          echo "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"
          
          SYNC_SUMMARY=""
          SUCCESS_COUNT=0
          FAILURE_COUNT=0
          SKIP_COUNT=0
          
          # 第一步：预处理，找出重名镜像
          echo "=== 预处理：检测重名镜像 ==="
          declare -A duplicate_images
          declare -A temp_map
          
          while IFS= read -r line || [ -n "$line" ]; do
              # 忽略空行与注释
              [[ -z "$line" ]] && continue
              if echo "$line" | grep -q '^\s*#'; then
                  continue
              fi
              
              # 获取镜像的完整名称
              raw_image=$(echo "$line" | awk '{print $NF}')
              # 移除 @sha256: 等摘要信息
              image="${raw_image%%@*}"
              # 获取镜像名:版本号 例如 nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              # 获取命名空间
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              
              # 如果命名空间为空，使用特定标记
              if [[ -z "$name_space" ]]; then
                  name_space="library"
              fi
              
              # 获取镜像名（不含标签）例如 nginx
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
              
              # 如果镜像存在于数组中，则检查是否有重名冲突
              if [[ -n "${temp_map[$image_name]}" ]]; then
                   # 如果 temp_map 已经存在镜像名，判断是不是同一命名空间
                   if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                      duplicate_images[$image_name]="true"
                   fi
              else
                  # 存镜像的命名空间
                  temp_map[$image_name]="$name_space"
              fi
          done < images.txt
          
          echo "✅ 预处理完成，发现 ${#duplicate_images[@]} 个重名镜像"
          
          # 第二步：并行检查镜像状态
          echo "=== 并行检查镜像状态 ==="
          
          # 创建临时文件存储镜像信息
          TEMP_FILE=$(mktemp)
          NEED_SYNC_FILE=$(mktemp)
          SKIPPED_FILE=$(mktemp)
          
          # 计算总行数
          TOTAL_LINES=$(wc -l < images.txt)
          LINE_NUMBER=0
          
          # 逐行读取并处理镜像信息
          while IFS= read -r line || [ -n "$line" ]; do
              LINE_NUMBER=$((LINE_NUMBER + 1))
              
              # 忽略空行与注释
              [[ -z "$line" ]] && continue
              if echo "$line" | grep -q '^\s*#'; then
                  echo "📝 第 $LINE_NUMBER 行: 跳过注释行"
                  continue
              fi
              
              # 获取原始镜像信息
              raw_image=$(echo "$line" | awk '{print $NF}')
              # 移除 @sha256: 等摘要信息
              image="${raw_image%%@*}"
              
              # 获取镜像名:版本号 例如 nginx:1.25.3
              image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
              # 获取命名空间
              name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
              
              # 如果命名空间为空，使用特定标记
              if [[ -z "$name_space" ]]; then
                  name_space="library"
              fi
              
              # 获取镜像名（不含标签）例如 nginx
              image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
              
              # 提取平台架构信息
              platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
              
              # 如果存在架构信息，将架构信息拼到镜像名称前面
              if [ -z "$platform" ]; then
                  platform_prefix=""
              else
                  platform_prefix="${platform//\//_}_"
              fi
              
              name_space_prefix=""
              # 如果镜像名重名且命名空间不同
              if [[ -n "${duplicate_images[$image_name]}" ]]; then
                 # 如果命名空间非空，将命名空间加到前缀
                 name_space_prefix="${name_space}_"
              fi
              
              # 构造目标镜像名称
              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
              
              # 将镜像信息写入临时文件
              echo "$LINE_NUMBER|$image|$new_image|$image_name_tag|$name_space|${platform:-默认}|${duplicate_images[$image_name]:+是 (使用前缀)}" >> "$TEMP_FILE"
          done < images.txt
          
          # 定义并行检查函数
          check_image_status() {
              local line_data="$1"
              local line_number=$(echo "$line_data" | cut -d'|' -f1)
              local image=$(echo "$line_data" | cut -d'|' -f2)
              local new_image=$(echo "$line_data" | cut -d'|' -f3)
              local image_name_tag=$(echo "$line_data" | cut -d'|' -f4)
              local name_space=$(echo "$line_data" | cut -d'|' -f5)
              local platform=$(echo "$line_data" | cut -d'|' -f6)
              local duplicate_info=$(echo "$line_data" | cut -d'|' -f7)
              
              echo "--- 检查第 $line_number 行 ---"
              echo "原始镜像: $image"
              echo "目标镜像: $new_image"
              echo "平台架构: $platform"
              echo "命名空间: $name_space"
              echo "重名处理: $duplicate_info"
              
              # 检查目标镜像是否存在
              if skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" > /dev/null 2>&1; then
                  # 目标镜像存在，比较镜像创建时间
                  echo "目标镜像存在，比较镜像创建时间..."
                  
                  # 获取源镜像的创建时间 - 修复时间比较逻辑
                  SRC_INFO=$(skopeo inspect docker://$image 2>/dev/null)
                  if [ $? -eq 0 ]; then
                    SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.Created // empty' 2>/dev/null)
                    # 尝试多种可能的时间字段
                    if [ -z "$SRC_CREATED_RAW" ] || [ "$SRC_CREATED_RAW" = "null" ]; then
                      SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.created // empty' 2>/dev/null)
                    fi
                    if [ -z "$SRC_CREATED_RAW" ] || [ "$SRC_CREATED_RAW" = "null" ]; then
                      SRC_CREATED_RAW=$(echo "$SRC_INFO" | jq -r '.Labels."org.opencontainers.image.created" // empty' 2>/dev/null)
                    fi
                  else
                    SRC_CREATED_RAW=""
                  fi
                  
                  # 获取目标镜像的创建时间
                  TARGET_INFO=$(skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" 2>/dev/null)
                  if [ $? -eq 0 ]; then
                    TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.Created // empty' 2>/dev/null)
                    # 尝试多种可能的时间字段
                    if [ -z "$TARGET_CREATED_RAW" ] || [ "$TARGET_CREATED_RAW" = "null" ]; then
                      TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.created // empty' 2>/dev/null)
                    fi
                    if [ -z "$TARGET_CREATED_RAW" ] || [ "$TARGET_CREATED_RAW" = "null" ]; then
                      TARGET_CREATED_RAW=$(echo "$TARGET_INFO" | jq -r '.Labels."org.opencontainers.image.created" // empty' 2>/dev/null)
                    fi
                  else
                    TARGET_CREATED_RAW=""
                  fi
                  
                  if [ -n "$SRC_CREATED_RAW" ] && [ -n "$TARGET_CREATED_RAW" ] && [ "$SRC_CREATED_RAW" != "null" ] && [ "$TARGET_CREATED_RAW" != "null" ]; then
                      # 解析源镜像时间
                      SRC_TIMESTAMP=$(date -u -d "$SRC_CREATED_RAW" +%s 2>/dev/null || echo "0")
                      
                      # 解析目标镜像时间
                      TARGET_TIMESTAMP=$(date -u -d "$TARGET_CREATED_RAW" +%s 2>/dev/null || echo "0")
                      
                      # 如果时间戳解析失败，回退到比较镜像摘要
                      if [ $SRC_TIMESTAMP -ne 0 ] && [ $TARGET_TIMESTAMP -ne 0 ]; then
                          # 比较时间戳：如果Docker Hub的镜像创建时间晚于阿里云的镜像创建时间，则同步
                          if [ "$SRC_TIMESTAMP" -gt "$TARGET_TIMESTAMP" ]; then
                              echo "🔄 源镜像创建时间更新，需要同步: $image_name_tag"
                              echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|$SRC_TIMESTAMP|$TARGET_TIMESTAMP" >&3
                          elif [ "$SRC_TIMESTAMP" -eq "$TARGET_TIMESTAMP" ]; then
                              echo "✅ 源镜像与目标镜像创建时间相同，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|same_time" >&3
                          else
                              echo "✅ 源镜像创建时间早于目标镜像，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|older_source" >&3
                          fi
                      else
                          # 时间戳解析失败，比较镜像摘要
                          # 获取源镜像摘要
                          SRC_DIGEST=$(echo "$SRC_INFO" | jq -r '.Digest // empty' 2>/dev/null)
                          if [ -z "$SRC_DIGEST" ] || [ "$SRC_DIGEST" = "null" ]; then
                            SRC_DIGEST=$(echo "$SRC_INFO" | jq -r '.digest // empty' 2>/dev/null)
                          fi
                          
                          # 获取目标镜像摘要
                          TARGET_DIGEST=$(echo "$TARGET_INFO" | jq -r '.Digest // empty' 2>/dev/null)
                          if [ -z "$TARGET_DIGEST" ] || [ "$TARGET_DIGEST" = "null" ]; then
                            TARGET_DIGEST=$(echo "$TARGET_INFO" | jq -r '.digest // empty' 2>/dev/null)
                          fi
                          
                          if [ -n "$SRC_DIGEST" ] && [ -n "$TARGET_DIGEST" ] && [ "$SRC_DIGEST" = "$TARGET_DIGEST" ]; then
                              echo "✅ 镜像摘要相同，跳过: $image_name_tag"
                              echo "SKIPPED|$line_number|$image_name_tag|same_digest" >&3
                          else
                              echo "🔄 镜像摘要不同或无法获取，需要同步: $image_name_tag"
                              echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
                          fi
                      fi
                  else
                      # 无法获取创建时间，检查镜像大小作为辅助判断
                      SRC_SIZE=$(skopeo inspect docker://$image --format '{{.Size}}' 2>/dev/null || echo "0")
                      TARGET_SIZE=$(skopeo inspect docker://$new_image --creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" --format '{{.Size}}' 2>/dev/null || echo "0")
                      
                      if [ "$SRC_SIZE" != "0" ] && [ "$TARGET_SIZE" != "0" ] && [ "$SRC_SIZE" = "$TARGET_SIZE" ]; then
                          echo "✅ 镜像大小相同，可能已同步，跳过: $image_name_tag"
                          echo "SKIPPED|$line_number|$image_name_tag|same_size" >&3
                      else
                          echo "🔄 无法确定镜像状态，需要同步: $image_name_tag"
                          echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
                      fi
                  fi
              else
                  echo "🔄 目标镜像不存在，需要同步: $image_name_tag"
                  echo "NEED_SYNC|$line_number|$image|$new_image|$image_name_tag|$name_space|$platform|$duplicate_info|0|0" >&3
              fi
          }
          
          export -f check_image_status
          export ALIYUN_REGISTRY_USER ALIYUN_REGISTRY_PASSWORD
          
          # 设置文件描述符用于收集结果
          exec 3<> >(while read result; do
            if [[ $result == NEED_SYNC* ]]; then
              echo "$result" >> "$NEED_SYNC_FILE"
            elif [[ $result == SKIPPED* ]]; then
              echo "$result" >> "$SKIPPED_FILE"
            fi
          done)
          
          # 使用并行处理所有镜像状态检查
          cat "$TEMP_FILE" | xargs -P 4 -I {} bash -c 'check_image_status "$@"' _ {}
          
          # 关闭文件描述符
          exec 3<&-
          wait
          
          # 第三步：串行同步需要更新的镜像
          echo "=== 开始串行同步需要更新的镜像 ==="
          
          # 统计跳过的镜像
          while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                  skip_reason=$(echo "$line" | cut -d'|' -f4)
                  case $skip_reason in
                      "same_time") reason_text="创建时间相同" ;;
                      "older_source") reason_text="目标镜像已更新" ;;
                      "same_digest") reason_text="摘要相同" ;;
                      "same_size") reason_text="大小相同" ;;
                  esac
                  image_name_tag=$(echo "$line" | cut -d'|' -f3)
                  SYNC_SUMMARY="${SYNC_SUMMARY}\n⏭️ $image_name_tag ($reason_text)"
                  SKIP_COUNT=$((SKIP_COUNT + 1))
              fi
          done < "$SKIPPED_FILE"
          
          # 串行同步需要更新的镜像
          while IFS= read -r line; do
              if [[ -n "$line" ]]; then
                  line_number=$(echo "$line" | cut -d'|' -f2)
                  image=$(echo "$line" | cut -d'|' -f3)
                  new_image=$(echo "$line" | cut -d'|' -f4)
                  image_name_tag=$(echo "$line" | cut -d'|' -f5)
                  
                  echo "--- 同步第 $line_number 行: $image_name_tag ---"
                  echo "原始镜像: $image"
                  echo "目标镜像: $new_image"
                  
                  echo "开始同步镜像..."
                  
                  # 执行同步（带超时和详细日志）
                  # 1. 拉取镜像
                  echo "步骤 1/3: 拉取源镜像..."
                  if timeout 300 docker pull "$image"; then
                      echo "  ✅ 拉取成功"
                      
                      # 2. 重新标记镜像
                      echo "步骤 2/3: 重新标记镜像..."
                      if docker tag "$image" "$new_image"; then
                          echo "  ✅ 重标记成功"
                          
                          # 3. 推送到阿里云
                          echo "步骤 3/3: 推送到阿里云..."
                          if timeout 600 docker push "$new_image"; then
                              echo "  ✅ 推送成功"
                              
                              # 清理本地镜像
                              docker rmi "$image" "$new_image" 2>/dev/null || true
                              docker system prune -f 2>/dev/null || true
                              
                              SYNC_SUMMARY="${SYNC_SUMMARY}\n✨ $image_name_tag"
                              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                              echo "✅ 同步完成: $image_name_tag"
                          else
                              echo "  ❌ 推送失败"
                              SYNC_SUMMARY="${SYNC_SUMMARY}\n🚨 $image_name_tag (推送失败)"
                              FAILURE_COUNT=$((FAILURE_COUNT + 1))
                          fi
                      else
                          echo "  ❌ 重标记失败"
                          SYNC_SUMMARY="${SYNC_SUMMARY}\n🚨 $image_name_tag (重命名失败)"
                          FAILURE_COUNT=$((FAILURE_COUNT + 1))
                      fi
                  else
                      echo "  ❌ 拉取失败"
                      SYNC_SUMMARY="${SYNC_SUMMARY}\n🚨 $image_name_tag (拉取失败)"
                      FAILURE_COUNT=$((FAILURE_COUNT + 1))
                  fi
                  
                  echo ""
              fi
          done < "$NEED_SYNC_FILE"
          
          echo "=== 同步完成 ==="
          echo "成功: $SUCCESS_COUNT, 跳过: $SKIP_COUNT, 失败: $FAILURE_COUNT"
          
          # 清理临时文件
          rm -f "$TEMP_FILE" "$NEED_SYNC_FILE" "$SKIPPED_FILE"
          
          # 写入环境变量
          echo "SUCCESS_COUNT=$SUCCESS_COUNT" >> $GITHUB_ENV
          echo "FAILURE_COUNT=$FAILURE_COUNT" >> $GITHUB_ENV
          echo "SKIP_COUNT=$SKIP_COUNT" >> $GITHUB_ENV
          {
            echo 'SYNC_RESULT<<EOF'
            if [ -n "$SYNC_SUMMARY" ]; then
                echo -e "$SYNC_SUMMARY"
            else
                echo "本次没有需要同步的新镜像"
            fi
            echo 'EOF'
          } >> $GITHUB_ENV      
      # 7. 清理 Docker 系统
      - name: Clean up Docker system
        if: always()
        run: |
          echo "=== 清理 Docker 系统 ==="
          docker system prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          echo "✅ 清理完成"
          echo "剩余磁盘空间:"
          df -h
      
      # 8. 发送 Webhook 通知
      - name: 发送 Webhook 通知
        if: always()
        run: |
          if [ -z "${{ secrets.WEBHOOK_URL }}" ]; then
            echo "⚠️ 未配置 Webhook URL，跳过通知"
            exit 0
          fi
          
          S_COUNT=${{ env.SUCCESS_COUNT }}
          F_COUNT=${{ env.FAILURE_COUNT }}
          K_COUNT=${{ env.SKIP_COUNT }}
          
          # 1. 判定标题和主状态
          if [ "$F_COUNT" -gt 0 ]; then
              TITLE="❌ 阿里云镜像同步失败"
              CONTENT="⚠️ 警告：有 $F_COUNT 个镜像同步出现异常，请及时检查。"
          elif [ "$S_COUNT" -gt 0 ]; then
              TITLE="✅ 阿里云镜像同步成功"
              CONTENT="本次新增同步镜像如下："
          elif [ "$K_COUNT" -gt 0 ]; then
              TITLE="⏭️ 同步任务完成 (镜像已是最新)"
              CONTENT="基于创建时间比较，所有镜像已是最新版本，无需同步。"
          else
              TITLE="☕ 同步任务完成 (无镜像需要处理)"
              CONTENT="检测到 images.txt 中无有效镜像需要处理。"
          fi
          
          # 2. 组装最终文本
          RAW_TEXT=$(cat <<EOF
          $TITLE
          ━━━━━━━━━━━━━━━━
          $CONTENT
          ${{ env.SYNC_RESULT }}
          
          📊 统计: 成功 $S_COUNT | 跳过 $K_COUNT | 失败 $F_COUNT
          📅 时间: $(date '+%Y-%m-%d %H:%M:%S')
          🔗 详情: [查看 GitHub Action 日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          )
          
          # 3. 发送通知
          echo "发送 Webhook 通知..."
          JSON_PAYLOAD=$(jq -n --arg msg "$RAW_TEXT" '{"msg_type":"text","content":{"text":$msg}}')
          
          # 尝试发送，最多重试3次
          for i in {1..3}; do
              if curl -s -X POST -H "Content-Type: application/json" \
                 -d "$JSON_PAYLOAD" \
                 -w "HTTP Status: %{http_code}" \
                 "${{ secrets.WEBHOOK_URL }}" > /dev/null 2>&1; then
                  echo "✅ 通知发送成功 (尝试 $i 次)"
                  break
              else
                  echo "⚠️ 通知发送失败，第 $i 次尝试"
                  sleep 2
              fi
          done
